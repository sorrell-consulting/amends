<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="720" viewBox="0 0 1140 720" role="img" aria-labelledby="title desc">
<title id="title">Atomic state changes; asynchronous publication</title>
<desc id="desc">Implemented eight-component reference architecture. The worker atomically persists state, outputs, quarantine, outbox and source position in Postgres. A relay publishes to an output topic, and a durable version-aware view materializes messages. The verifier independently compares a complete source prefix and the view at a bounded cut.</desc>
