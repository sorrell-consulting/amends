name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install pinned documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Strict build, links, and chart values
        run: make docs-check
      - name: Upload Pages artifact when publication is enabled
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AMENDS_DOCS_PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Publication requires Pages setup and AMENDS_DOCS_PUBLISH=true.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AMENDS_DOCS_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
