{# Official outlined artwork, with the destination named by the enclosing link. #}
<span class="sc-logo sc-logo--horizontal" aria-hidden="true">
  <img class="sc-logo__light" src="{{ config.theme.logo | url }}" width="514" height="143" alt="">
  <img class="sc-logo__dark" src="{{ 'assets/brand/logo/logo-horizontal-reversed.svg' | url }}" width="514" height="143" alt="">
</span>
<span class="sc-logo sc-logo--mark" aria-hidden="true">
  <img class="sc-logo__light" src="{{ 'assets/brand/logo/logo-mark.svg' | url }}" width="96" height="52" alt="">
  <img class="sc-logo__dark" src="{{ 'assets/brand/logo/logo-mark-reversed.svg' | url }}" width="96" height="52" alt="">
</span>
